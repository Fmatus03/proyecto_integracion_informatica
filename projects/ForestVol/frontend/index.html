<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForestVol - Hito 0</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f3efe5;
        --panel: #fffaf0;
        --ink: #1d2a22;
        --accent: #3d6b52;
      }

      body {
        margin: 0;
        font-family: Georgia, "Times New Roman", serif;
        background: radial-gradient(circle at top, #ffffff, var(--bg) 65%);
        color: var(--ink);
      }

      main {
        max-width: 860px;
        margin: 3rem auto;
        padding: 2rem;
        background: var(--panel);
        border: 1px solid rgba(29, 42, 34, 0.1);
        border-radius: 20px;
        box-shadow: 0 20px 50px rgba(61, 107, 82, 0.08);
      }

      h1 {
        margin-top: 0;
        font-size: clamp(2rem, 6vw, 4rem);
      }

      code {
        background: rgba(61, 107, 82, 0.1);
        padding: 0.15rem 0.35rem;
        border-radius: 0.35rem;
      }
    </style>
  </head>
  <body>
    <main>
      <p>ForestVol MVP</p>
      <h1>Hito 0: base tecnica operativa</h1>
      <p>
        Este contenedor existe solo como scaffold operativo. El frontend final en Vue 3 queda
        explicitamente fuera del alcance de este run.
      </p>
      <p>
        La validacion tecnica del hito se centra en <code>docker compose</code>, la API FastAPI y
        la primera corrida real contra NodeODM.
      </p>
    </main>
  </body>
</html>

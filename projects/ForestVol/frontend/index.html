<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ForestVol - Volumetria PDI</title>
    <style>
      :root {
        color-scheme: light;
        --bg: #f6f7f4;
        --panel: #ffffff;
        --ink: #17211b;
        --muted: #617167;
        --line: #d8dfd9;
        --accent: #276749;
        --warn: #9a6700;
        --fail: #b42318;
      }

      * { box-sizing: border-box; }

      body {
        margin: 0;
        font-family: Arial, Helvetica, sans-serif;
        background: var(--bg);
        color: var(--ink);
      }

      main {
        width: min(1040px, calc(100vw - 32px));
        margin: 32px auto;
      }

      header {
        display: flex;
        justify-content: space-between;
        align-items: end;
        gap: 24px;
        padding-bottom: 18px;
        border-bottom: 1px solid var(--line);
      }

      h1 {
        margin: 0;
        font-size: 28px;
        letter-spacing: 0;
      }

      .status {
        color: var(--muted);
        font-size: 14px;
      }

      .toolbar {
        display: grid;
        grid-template-columns: 1fr auto;
        gap: 10px;
        margin: 22px 0;
      }

      input,
      button {
        height: 40px;
        border-radius: 6px;
        font-size: 14px;
      }

      input {
        border: 1px solid var(--line);
        padding: 0 12px;
      }

      button {
        border: 0;
        background: var(--accent);
        color: white;
        padding: 0 16px;
        cursor: pointer;
      }

      .grid {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 14px;
      }

      .panel {
        background: var(--panel);
        border: 1px solid var(--line);
        border-radius: 8px;
        padding: 16px;
      }

      .metric {
        font-size: 30px;
        font-weight: 700;
        margin-top: 8px;
      }

      .label {
        color: var(--muted);
        font-size: 13px;
      }

      .wide { grid-column: 1 / -1; }

      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 14px;
      }

      th,
      td {
        text-align: left;
        padding: 10px 8px;
        border-bottom: 1px solid var(--line);
        vertical-align: top;
      }

      .PASS { color: var(--accent); font-weight: 700; }
      .WARNING { color: var(--warn); font-weight: 700; }
      .FAIL { color: var(--fail); font-weight: 700; }

      ul {
        margin: 8px 0 0;
        padding-left: 18px;
      }

      @media (max-width: 760px) {
        header,
        .toolbar { display: grid; grid-template-columns: 1fr; }
        .grid { grid-template-columns: 1fr; }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <div>
          <div class="status">ForestVol MVP</div>
          <h1>Volumetria oficial PDI</h1>
        </div>
        <div class="status" id="pipeline-state">Sin sesion cargada</div>
      </header>

      <section class="toolbar">
        <input id="session-id" placeholder="session_id" autocomplete="off" />
        <button id="load-results">Consultar</button>
      </section>

      <section class="grid">
        <div class="panel">
          <div class="label">Volumen oficial</div>
          <div class="metric" id="volume">--</div>
          <div class="label" id="volume-method">point_density_integration</div>
        </div>
        <div class="panel">
          <div class="label">Confidence score</div>
          <div class="metric" id="confidence">--</div>
          <div class="label" id="confidence-level">--</div>
        </div>
        <div class="panel">
          <div class="label">Error final</div>
          <div class="metric" id="error">--</div>
          <div class="label">solo contra Ground Truth oficial</div>
        </div>

        <div class="panel wide">
          <div class="label">Quality gates</div>
          <table>
            <thead>
              <tr>
                <th>Estado</th>
                <th>Gate</th>
                <th>Metrica</th>
                <th>Explicacion</th>
              </tr>
            </thead>
            <tbody id="gates">
              <tr><td colspan="4">Sin datos</td></tr>
            </tbody>
          </table>
        </div>

        <div class="panel wide">
          <div class="label">Diagnostico automatico</div>
          <ul id="diagnostic">
            <li>Sin datos</li>
          </ul>
        </div>
      </section>
    </main>
    <script>
      const apiBase = window.API_BASE_URL || "http://localhost:8000";
      const stateEl = document.getElementById("pipeline-state");
      const sessionInput = document.getElementById("session-id");
      const volumeEl = document.getElementById("volume");
      const methodEl = document.getElementById("volume-method");
      const confidenceEl = document.getElementById("confidence");
      const confidenceLevelEl = document.getElementById("confidence-level");
      const errorEl = document.getElementById("error");
      const gatesEl = document.getElementById("gates");
      const diagnosticEl = document.getElementById("diagnostic");

      function text(value, suffix = "") {
        return value === null || value === undefined ? "--" : `${value}${suffix}`;
      }

      function render(data) {
        stateEl.textContent = data.pipeline_state || "Sin estado";
        volumeEl.textContent = text(data.volume_m3, " m3");
        methodEl.textContent = data.volume_method || "point_density_integration";
        confidenceEl.textContent = text(data.confidence_score, "%");
        confidenceLevelEl.textContent = data.confidence_level || "--";
        errorEl.textContent = text(data.error_percentage, "%");
        const gates = data.quality_gates || [];
        gatesEl.innerHTML = gates.length
          ? gates.map((gate) => `
              <tr>
                <td class="${gate.status}">${gate.status}</td>
                <td>${gate.name || gate.gate}</td>
                <td>${gate.metric}: ${gate.value}</td>
                <td>${gate.explanation}</td>
              </tr>
            `).join("")
          : '<tr><td colspan="4">Sin datos</td></tr>';
        const diagnostic = data.diagnostic || [];
        diagnosticEl.innerHTML = diagnostic.length
          ? diagnostic.map((item) => `<li>${item}</li>`).join("")
          : "<li>Sin advertencias</li>";
      }

      async function loadResults() {
        const sessionId = sessionInput.value.trim();
        if (!sessionId) return;
        stateEl.textContent = "Consultando...";
        const response = await fetch(`${apiBase}/api/results/${encodeURIComponent(sessionId)}`);
        if (!response.ok) {
          stateEl.textContent = `Error ${response.status}`;
          return;
        }
        render(await response.json());
      }

      document.getElementById("load-results").addEventListener("click", loadResults);
      sessionInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") loadResults();
      });
    </script>
  </body>
</html>
